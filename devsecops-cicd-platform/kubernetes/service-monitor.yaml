apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: turbine-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - zephyrworks
  selector:
    matchLabels:
      app: turbine-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
